name: Visual audit fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply visual corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          def patch(path, old, new, name):
              p=root/path; s=p.read_text(encoding='utf-8')
              if new in s: return
              if s.count(old)!=1: raise SystemExit(f'{name}: expected one anchor, got {s.count(old)}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          patch('ams-shell/src/Ams.UI/Models/StepDefinitions.cs',
                'Label = "Random Mouse Position", ColorResourceKey = "StepMouseBrush", DefaultDelay = 55,',
                'Label = "Move to Random Area", ColorResourceKey = "StepMouseBrush", DefaultDelay = 55,',
                'random-area label')
          patch('ams-shell/src/Ams.UI/Models/StepDefinitions.cs',
                'Summarize = s => $"Random Mouse Position in region [',
                'Summarize = s => $"Move to Random Area in region [',
                'random-area summary')
          patch('ams-shell/src/Ams.UI/Models/StepTextsFa.cs',
                '        // "path" — openFile / playAudio / runExe / playScript\n',
                '        ["randomMousePosition:action"] = "عمل بعد از رسیدن: فقط حرکت / کلیک چپ / کلیک راست / اسکرول",\n        ["randomMousePosition:scrollDelta"] = "مقدار اسکرول بعد از رسیدن (منفی = پایین، مثبت = بالا)",\n\n        // "path" — openFile / playAudio / runExe / playScript\n',
                'random-area Persian labels')
          patch('ams-shell/src/Ams.UI/Views/StepDialog.xaml',
                'Title="Step" Width="440" SizeToContent="Height"',
                'Title="Step" Width="620" MinWidth="560" SizeToContent="Height"',
                'step dialog width')
          patch('ams-shell/src/Ams.UI/Views/StepDialog.xaml',
                'MaxHeight="480" VerticalScrollBarVisibility="Auto"',
                'MaxHeight="680" VerticalScrollBarVisibility="Auto"',
                'step dialog height')
          p=root/'ams-shell/src/Ams.UI/MainWindow.FooterUi.cs'; s=p.read_text(encoding='utf-8')
          old='''        var layout = new Grid { FlowDirection = FlowDirection.RightToLeft };
                  layout.RowDefinitions.Add(new RowDefinition { Height = GridLength.Auto });
                  layout.RowDefinitions.Add(new RowDefinition { Height = GridLength.Auto });'''
          new='''        var layout = new Grid { FlowDirection = FlowDirection.LeftToRight };
                  layout.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(1, GridUnitType.Star) });
                  layout.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });'''
          if new not in s:
              if s.count(old)!=1: raise SystemExit(f'footer grid anchor: {s.count(old)}')
              s=s.replace(old,new,1)
          old='''        Grid.SetRow(connectionWrap, 0);
                  layout.Children.Add(Card("بردها و اتصال", connectionWrap));'''
          new='''        Grid.SetColumn(connectionWrap, 0);
                  layout.Children.Add(Card("بردها و اتصال", connectionWrap));'''
          if old in s: s=s.replace(old,new,1)
          old='''        Grid.SetRow(actionWrap, 1);
                  layout.Children.Add(Card("کنترل اجرا", actionWrap));'''
          new='''        Grid.SetColumn(actionWrap, 1);
                  actionWrap.HorizontalAlignment = HorizontalAlignment.Right;
                  layout.Children.Add(Card("کنترل اجرا", actionWrap));'''
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('visual corrections applied')
          PY
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ams-shell/src/Ams.UI/Models/StepDefinitions.cs ams-shell/src/Ams.UI/Models/StepTextsFa.cs ams-shell/src/Ams.UI/Views/StepDialog.xaml ams-shell/src/Ams.UI/MainWindow.FooterUi.cs project-state/QUALITY_GATE_RULE.md
          if ! git diff --cached --quiet; then git commit -m "Complete visual audit for random area and footer"; git push; fi

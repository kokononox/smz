name: GuardHardwareMonitor Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/GuardHardwareMonitor/**"
      - "tests/GuardMonitorDiagnostics/**"
      - ".github/workflows/guard-hardware-monitor.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test diagnostics
        shell: pwsh
        run: |
          dotnet run --project tests/GuardMonitorDiagnostics/GuardMonitorDiagnostics.csproj -c Release 2>&1 | Tee-Object -FilePath test-output.txt
          if ($LASTEXITCODE -ne 0) {
            $detail = (Get-Content test-output.txt -Tail 12) -join ' | '
            Write-Output "::error::$detail"
            exit 1
          }
      - name: Restore
        run: dotnet restore tools/GuardHardwareMonitor/GuardHardwareMonitor.csproj
      - name: Build
        run: dotnet build tools/GuardHardwareMonitor/GuardHardwareMonitor.csproj -c Release --no-restore
      - name: Publish win-x64
        run: dotnet publish tools/GuardHardwareMonitor/GuardHardwareMonitor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/GuardHardwareMonitor-win-x64
      - name: Add quick start
        shell: pwsh
        run: |
          Copy-Item tools/GuardHardwareMonitor/README.md artifacts/GuardHardwareMonitor-win-x64/README.md
          Copy-Item tools/GuardHardwareMonitor/README-FA.md artifacts/GuardHardwareMonitor-win-x64/README-FA.md
          @'
          @echo off
          cd /d "%~dp0"
          GuardHardwareMonitor.exe %*
          pause
          '@ | Set-Content -Encoding ascii artifacts/GuardHardwareMonitor-win-x64/Start-Monitor.cmd
          @'
          @echo off
          cd /d "%~dp0"
          set /p PICO_PORT=Enter Pico COM port (example COM14):
          if not defined PICO_PORT exit /b 1
          GuardHardwareMonitor.exe --port "%PICO_PORT%"
          pause
          '@ | Set-Content -Encoding ascii artifacts/GuardHardwareMonitor-win-x64/Start-Pico-Port.cmd
          Compress-Archive -Path artifacts/GuardHardwareMonitor-win-x64/* -DestinationPath artifacts/GuardHardwareMonitor-win-x64.zip -Force
          (Get-FileHash artifacts/GuardHardwareMonitor-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -Encoding ascii artifacts/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GuardHardwareMonitor-win-x64
          path: |
            artifacts/GuardHardwareMonitor-win-x64.zip
            artifacts/sha256.txt
          if-no-files-found: error

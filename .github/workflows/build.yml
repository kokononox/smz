name: build-test-package

# Classroom Studio CI — every push to main or the active feature branches builds
# the WPF app on Windows and only packages when ALL tests are green.
# Green -> a GitHub Release appears with the zip (visible via the releases API).
# Red   -> an Issue opens naming the failed step + the tail of the test log.

on:
  workflow_dispatch:
  push:
    branches: [main, feat/classroom-client-uf2-companion, feat/classroom-dual-profile-capture]
    # doc-only pushes (project state, patch notes) do not need a build+test cycle
    paths-ignore:
      - 'project-state/**'
      - '**.md'

permissions:
  contents: write   # publish the green-build release
  issues: write     # open an issue when CI fails
  actions: read     # read job/step conclusions for the failure issue

jobs:
  build-native-client-runtimes:
    name: Build 30 Classroom native receiver runtimes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Classroom Studio repository
        uses: actions/checkout@v4
      - name: Check out Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: pico-sdk
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build
      - name: Install ARM GNU Toolchain 14.2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/arm-gnu-toolchain.tar.xz"
          install_dir="$RUNNER_TEMP/arm-gnu-toolchain-14.2.rel1"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 600 \
            --output "$archive" \
            'https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz'
          mkdir -p "$install_dir"
          tar -xJf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/arm-none-eabi-gcc" --version
      - name: Configure Pico SDK path
        run: echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> "$GITHUB_ENV"
      - name: Host-test mirror framing and event validation
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -I firmware/abvm/pico \
            firmware/abvm/tests/mirror_frame_smoke.c \
            firmware/abvm/pico/mirror_frame.c \
            -o "$RUNNER_TEMP/mirror-frame-smoke"
          "$RUNNER_TEMP/mirror-frame-smoke"
      - name: Compile dual-sensor smoke ABP
        run: |
          python tools/abvm.py compile firmware/abvm/tests/abvm_dual_guard_smoke.amsj \
            "$RUNNER_TEMP/dual-guard-smoke.abp" \
            --routes Desktop Restart Startup LoginOrDc Dc CharacterDashboard EnteringGameLoading Game Targeted TargetedRepeat Whisper WhisperRepeat Finish
      - name: Build all receiver-enabled native runtime identities
        run: |
          bash firmware/abvm/pico/build_batch.sh \
            "$RUNNER_TEMP/dual-guard-smoke.abp" \
            firmware/abvm/pico/batch30.json \
            build/native-runtime
          count="$(find build/native-runtime -mindepth 2 -maxdepth 2 \
            -type f -name '*.uf2' ! -path '*/.build-batch/*' | wc -l)"
          test "$count" -eq 30
      - name: Upload receiver-enabled native runtimes
        uses: actions/upload-artifact@v4
        with:
          name: classroom-native-client-runtimes
          path: build/native-runtime
          if-no-files-found: error
          retention-days: 14

  build:
    needs: build-native-client-runtimes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download receiver-enabled native runtimes
        uses: actions/download-artifact@v4
        with:
          name: classroom-native-client-runtimes
          path: ${{ runner.temp }}/native-runtime

      - name: Stage the 30 native runtime templates
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'native-runtime'
          $target = 'firmware/native-runtime'
          if (Test-Path $target) { Remove-Item -Recurse -Force $target }
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item (Join-Path $source '*') $target -Recurse -Force
          $count = (Get-ChildItem $target -Recurse -Filter '*.uf2' | Measure-Object).Count
          if ($count -ne 30) { throw "Expected 30 native runtime templates, found $count" }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # v0.9.58 lesson: NEVER ship a bridge.py that does not compile
      - name: Compile-check bridge stack
        run: python -m py_compile ams-shell/bridge/bridge.py ams-shell/bridge/ams_serial.py ams-shell/bridge/ams_crypto.py

      # deterministic: importing the modules proves every file exists and every
      # import resolves — no subprocess, no stdin races, no hangs (bridge.main is
      # __main__-guarded so importing it is safe and side-effect free)
      - name: Verify bridge stack imports
        run: python -c "import sys; sys.path.insert(0, 'ams-shell/bridge'); import ams_crypto, ams_serial, bridge; print('bridge stack imports OK')"

      # the v0.9.57 regression: main() uses os.path but 'import os' was missing —
      # py_compile cannot see that class of bug, so pin it statically forever
      - name: Pin the import-os regression
        run: python -c "import pathlib; s = pathlib.Path('ams-shell/bridge/bridge.py').read_text(encoding='utf-8'); assert '\nimport os\n' in s, 'bridge.py lost import os again'"

      # v0.9.59 — the Pico brain transport is behavior-tested with a fake data port
      - name: Behavior-test Pico brain transport
        run: python tools/test_bridge_pico.py

      - name: Restore
        run: dotnet restore ams-shell/AMS.sln

      - name: Build (Release)
        run: dotnet build ams-shell/AMS.sln -c Release --no-restore

      # v0.9.58b — why runs #6-#8 died at the test step with an EMPTY log:
      # the step said `dotnet run --project tests/TestRunner` but the project file is
      # tests/TestRunner.csproj — MSBuild fails instantly, and since the error goes to
      # STDERR while Tee only captured STDOUT, the issue reported "no test log".
      # Fixes: build the test project as its own step (compile errors now surface in
      # full), wipe the committed tests/bin + tests/obj artifacts first (they carry the
      # dev machine's absolute paths), merge STDERR into the log, use the real csproj.
      - name: Build TestRunner
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin, tests/obj -ErrorAction SilentlyContinue
          dotnet build tests/TestRunner.csproj -c Release

      # fresh filename on purpose: the repo carries historical test-output.txt files
      # and a stale one must never be mistaken for this run's log.
      - name: Run TestRunner
        shell: pwsh
        run: |
          dotnet run --project tests/TestRunner.csproj -c Release --no-build 2>&1 | Tee-Object ci-test-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path ci-test-output.txt -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }

      - name: Package release zip
        if: success()
        shell: pwsh
        run: |
          $out = "ams-shell/src/Ams.UI/bin/Release/net8.0-windows"
          Remove-Item -Recurse -Force "$out/bridge/__pycache__" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$out/*" -DestinationPath "Classroom-Studio-release.zip" -Force
          (Get-FileHash Classroom-Studio-release.zip -Algorithm SHA256).Hash | Out-File sha256.txt -Encoding ascii
          $results = (Select-String -Path ci-test-output.txt -Pattern '=== Results' | Select-Object -Last 1).Line
          @("**Tests:** $results", "", "**SHA256:** $(Get-Content sha256.txt -Raw)") | Out-File release_body.md -Encoding utf8

      - name: Upload feature-branch package artifact
        if: success() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Classroom-Studio-native-client-runtimes-${{ github.sha }}
          path: |
            Classroom-Studio-release.zip
            sha256.txt
            ci-test-output.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish green-build release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_number }}
          name: "CI green — run #${{ github.run_number }}"
          body_path: release_body.md
          files: |
            Classroom-Studio-release.zip
            sha256.txt
            ci-test-output.txt

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch (e) { return ''; } };
            const allLines = read('ci-test-output.txt').split('\n');
            const failLines = allLines.filter(l => /^(FAIL:|SKIP:)|error CS|error MSB|Build FAILED/i.test(l)).slice(-40);
            const tail = allLines.slice(-60).join('\n');
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
            });
            const jobLines = jobs.data.jobs.map(j => `job: ${j.conclusion || j.status} — ${j.name}`);
            const stepLines = jobs.data.jobs.flatMap(j => (j.steps || []).map(s =>
              `${s.conclusion || s.status} — ${s.name}`));
            const runUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI failed — run #${context.runNumber}`,
              body: '**Run:** ' + runUrl
                + '\n\n**Jobs:**\n' + jobLines.join('\n')
                + '\n\n**Steps:**\n' + stepLines.join('\n')
                + '\n\n**Failure lines:**\n```\n' + (failLines.join('\n') || '(none matched)') + '\n```'
                + '\n\n**Test log tail:**\n```\n' + (tail || '(no test log — failure before the test step)') + '\n```'
            });
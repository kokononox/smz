name: ABVM Pico diagnostic

on:
  pull_request:
    paths:
      - 'firmware/abvm/**'
      - 'tools/abvm*.py'
      - '.github/workflows/abvm-pico-diagnostic.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  pico-diagnostic:
    name: ABVM / Pico diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.1.1
          path: pico-sdk
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ARM toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build
      - name: Build with captured diagnostics
        shell: bash
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          set -euo pipefail
          {
            python tools/abvm.py compile firmware/abvm/tests/abvm_smoke.amsj "$RUNNER_TEMP/program.abp" --routes Game Whisper
            cmake -S firmware/abvm/pico -B "$RUNNER_TEMP/abvm-pico" -G Ninja -DPICO_BOARD=pico -DABVM_PROGRAM="$RUNNER_TEMP/program.abp"
            cmake --build "$RUNNER_TEMP/abvm-pico" --parallel
          } 2>&1 | tee abvm-pico-build.log
      - name: Report Pico failure tail
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('abvm-pico-build.log') ? fs.readFileSync('abvm-pico-build.log','utf8') : '(no build log)';
            const tail = log.split('\n').slice(-120).join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'<!-- abvm-pico-failure -->\n**ABVM Pico failure tail**\n```\n'+tail+'\n```'});

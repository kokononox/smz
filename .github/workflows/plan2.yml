name: PLAN2 portable validation

on:
  push:
    branches: [feat/portable-plan2-app-0966]
  pull_request:
    paths:
      - 'portable/plan3/**'
      - '.github/workflows/plan2.yml'

permissions:
  contents: read

jobs:
  validate:
    name: "plan2 / ${{ matrix.check }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [hashes, compile, sim2, sim3, compiler, golden]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Golden-100 manifest hashes
        if: matrix.check == 'hashes'
        shell: bash
        run: |
          set -euo pipefail
          cd portable/plan3/CIRCUITPY
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 25
          test "$(grep -cve '^$' SHA256SUMS.txt)" -eq 21
          sha256sum -c SHA256SUMS.txt
      - name: Compile Python sources
        if: matrix.check == 'compile'
        run: python -m py_compile portable/plan3/CIRCUITPY/plan_engine.py portable/plan3/tools/*.py portable/plan3/sim/*.py
      - name: Run PLAN2 engine simulation
        if: matrix.check == 'sim2'
        run: python portable/plan3/sim/sim_plan2.py
      - name: Run PLAN3 parity simulation
        if: matrix.check == 'sim3'
        run: python portable/plan3/sim/sim_plan3.py
      - name: Run compiler golden and negative suite
        if: matrix.check == 'compiler'
        run: python portable/plan3/sim/test_plan_gen.py
      - name: Validate golden plans
        if: matrix.check == 'golden'
        run: |
          python portable/plan3/tools/plan_check.py portable/plan3/examples/ref-flow.plan.txt
          python portable/plan3/tools/plan_check.py portable/plan3/examples/ref-mouse-keys.plan.txt

# Exporter wiring validation trigger.

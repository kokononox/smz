name: AutoCycle integration validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ams-shell/**'
      - 'firmware/arm26/**'
      - 'firmware/arm28/**'
      - 'firmware/autocycle-hostusb-v5/**'
      - 'portable/plan3/**'
      - 'tools/abvm*.py'
      - 'spec/abvm/**'
      - 'firmware/abvm/**'
      - 'tests/LightTelemetryTests/**'
      - '.github/workflows/autocycle.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  arm28-compile:
    name: modern-autocycle / ARM 2.8 compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Compile Pro Micro firmware with a non-secret test key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ams_board28
          cp firmware/arm28/ams_board28.ino \
             firmware/arm28/ams_board26_impl.h \
             firmware/arm28/human_mouse_v3.h \
             firmware/arm28/portable_relative_mouse.h \
             /tmp/ams_board28/
          cp firmware/arm28/ams_key.example.h /tmp/ams_board28/ams_key.h
          arduino-cli compile --fqbn arduino:avr:leonardo /tmp/ams_board28

  portable-contracts:
    name: modern-autocycle / portable contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run every portable contract
        shell: bash
        run: |
          set -euo pipefail
          {
            # Modern AutoCycle contracts historically import these helpers from
            # CIRCUITPY. Overlay them only in the CI checkout; Golden-100 and
            # the flashable Golden inventory remain byte-for-byte untouched.
            for name in plan_cycle.py cycle_runtime.py restart_windows.py auto_resume_boot.py resume_essentials_runtime.py recovery_runtime.py; do
              cp "portable/plan3/CIRCUITPY-SPLIT/$name" "portable/plan3/CIRCUITPY/$name"
            done
            python -m py_compile portable/plan3/CIRCUITPY/*.py
            python -m py_compile portable/plan3/CIRCUITPY-MODERN/*.py
            python -m py_compile portable/plan3/CIRCUITPY-SPLIT/*.py
            python -m py_compile portable/plan3/tools/*.py portable/plan3/sim/*.py tools/abvm.py tools/generate_abvm_abi.py
            python tools/generate_abvm_abi.py --check
            python tools/abvm.py compile firmware/abvm/tests/abvm_smoke.amsj /tmp/abvm-native-smoke.abp --routes Game Whisper
            cc -std=c11 -Wall -Wextra -Werror -Ifirmware/abvm/include firmware/abvm/src/abvm_vm.c firmware/abvm/tests/abvm_vm_smoke.c -o /tmp/abvm-native-smoke
            /tmp/abvm-native-smoke /tmp/abvm-native-smoke.abp
            count=0
            for test in portable/plan3/sim/test_*.py; do
              echo "=== $test ==="
              python "$test"
              count=$((count + 1))
            done
            test "$count" -gt 0
            echo "AutoCycle contract files passed: $count"
          } 2>&1 | tee autocycle-portable.log
      - name: Report portable failure tail
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('autocycle-portable.log') ? fs.readFileSync('autocycle-portable.log','utf8') : '(no log)';
            const tail = log.split('\n').slice(-80).join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'<!-- autocycle-portable-failure -->\n**AutoCycle portable failure tail**\n```\n'+tail+'\n```'});

  windows-app:
    name: modern-autocycle / Windows TestRunner
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        shell: pwsh
        run: dotnet restore ams-shell/AMS.sln 2>&1 | Tee-Object windows-restore.log
      - name: Build Classroom Studio
        shell: pwsh
        run: dotnet build ams-shell/AMS.sln -c Release --no-restore 2>&1 | Tee-Object windows-build.log
      - name: Build TestRunner from a clean tree
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force tests/bin, tests/obj -ErrorAction SilentlyContinue
          dotnet build tests/TestRunner.csproj -c Release 2>&1 | Tee-Object windows-testrunner-build.log
      - name: Run TestRunner and reject any failure
        shell: pwsh
        run: |
          dotnet run --project tests/TestRunner.csproj -c Release --no-build 2>&1 | Tee-Object windows-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path windows-tests.log -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }
      - name: Run typed light telemetry tests
        shell: pwsh
        run: |
          dotnet run --project tests/LightTelemetryTests/LightTelemetryTests.csproj -c Release 2>&1 | Tee-Object light-telemetry-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path light-telemetry-tests.log -Pattern '([1-9][0-9]*) failed' -Quiet) { exit 1 }
      - name: Stage Windows test output
        if: success()
        shell: pwsh
        run: |
          $out = 'ams-shell/src/Ams.UI/bin/Release/net8.0-windows'
          Remove-Item -Recurse -Force "$out/bridge/__pycache__" -ErrorAction SilentlyContinue
          @(
            'Classroom Studio — Light State Profiles test build',
            'Source commit: ${{ github.event.pull_request.head.sha }}',
            'Diagnostic build only; Launch/Auto Resume light gating remains disabled.',
            'Login and DC share one light profile; DC recovery prepends exactly one ESC.'
          ) | Set-Content "$out/LIGHT-STATE-TEST.txt" -Encoding utf8
      - name: Upload gated Windows output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: light-state-windows-output
          path: |
            ams-shell/src/Ams.UI/bin/Release/net8.0-windows/**
            windows-tests.log
            light-telemetry-tests.log
          retention-days: 14
          if-no-files-found: error
      - name: Report Windows failure tail
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const names=['windows-restore.log','windows-build.log','windows-testrunner-build.log','windows-tests.log','light-telemetry-tests.log'];
            const text=names.map(n=>fs.existsSync(n)?('=== '+n+' ===\n'+fs.readFileSync(n,'utf8')):'').join('\n');
            const lines=text.split('\n');
            const failures=lines.filter(line=>line.includes('FAIL:')||line.includes('Unhandled exception')||line.includes('Results:')).join('\n');
            const tail=lines.slice(-100).join('\n');
            const report=(failures?'=== failure markers ===\n'+failures+'\n':'')+'=== tail ===\n'+tail;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'<!-- autocycle-windows-failure -->\n**AutoCycle Windows failure diagnostics**\n```\n'+report+'\n```'});

  test-package:
    name: modern-autocycle / diagnostic package
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/light-state-profiles'
    needs: [portable-contracts, windows-app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: light-state-windows-output
          path: staged
      - name: Package and hash
        shell: bash
        run: |
          set -euo pipefail
          cd staged/ams-shell/src/Ams.UI/bin/Release/net8.0-windows
          zip -qr ../../../../../../../Classroom-Studio-light-state-test.zip .
          cd ../../../../../../../
          sha256sum Classroom-Studio-light-state-test.zip | awk '{print toupper($1)}' > light-state-test-sha256.txt
          cat > TEST-GUIDE-FA.md <<'EOF'
          # راهنمای تست مرحله اول

          1. فایل ZIP را Extract کنید؛ برنامه را از داخل ZIP اجرا نکنید.
          2. `ClassroomStudio.exe` را اجرا کنید.
          3. وارد تب «وضعیت» شوید.
          4. فعلاً برد را وصل نکنید؛ ظاهر RTL و نمایش شش پروفایل را بررسی کنید.
          5. نتیجه مرحله اول را گزارش کنید تا تست اتصال و Live Watch را ادامه دهیم.

          این نسخه آزمایشی است و گیت اجرایی Launch/Auto Resume خاموش می‌ماند.
          EOF
          {
            echo '# Light State Profiles — test build'
            echo
            echo 'Source PR: #158'
            echo
            echo "Source commit: ${{ github.event.pull_request.head.sha }}"
            echo
            echo "SHA-256: $(cat light-state-test-sha256.txt)"
            echo
            echo 'All portable, Windows, TestRunner and typed light-profile gates passed before packaging.'
          } > release-body.md
      - name: Publish prerelease test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: light-state-test-${{ github.run_number }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: "Light State Profiles test #${{ github.run_number }}"
          prerelease: true
          body_path: release-body.md
          files: |
            Classroom-Studio-light-state-test.zip
            light-state-test-sha256.txt
            TEST-GUIDE-FA.md
            staged/windows-tests.log
            staged/light-telemetry-tests.log

name: Hourly Backup to Google Drive

on:
  schedule:
    - cron: '0 * * * *' # هر ساعت یکبار
  workflow_dispatch: # برای تست دستی

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Create backup archive
        run: |
          git clone --mirror "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo-backup.git
          tar -czf repo-backup.tar.gz repo-backup.git

      - name: Upload to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python -m pip install --quiet --disable-pip-version-check google-api-python-client google-auth
          python - <<'PY'
          import os
          import sys
          from google.auth.exceptions import RefreshError
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          folder_id = "1iovjPyfG_NSnsH_bq9lApi6rpUowlc73"
          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          try:
              credentials.refresh(Request())
          except RefreshError as exc:
              print(f"::error title=Google OAuth refresh failed::{exc}")
              print(
                  "::error::GOOGLE_REFRESH_TOKEN is expired or revoked. "
                  "Set the OAuth consent screen to 'In production', generate a new "
                  "refresh token, and update the GOOGLE_REFRESH_TOKEN secret."
              )
              sys.exit(1)
          drive = build("drive", "v3", credentials=credentials, cache_discovery=False)
          query = (
              f"'{folder_id}' in parents and "
              "name = 'latest-backup.tar.gz' and trashed = false"
          )
          result = drive.files().list(
              q=query,
              spaces="drive",
              fields="files(id,name)",
              includeItemsFromAllDrives=True,
              supportsAllDrives=True,
          ).execute()
          matches = result.get("files", [])
          media = MediaFileUpload(
              "repo-backup.tar.gz",
              mimetype="application/gzip",
              resumable=True,
          )

          if matches:
              file_id = matches[0]["id"]
              drive.files().update(
                  fileId=file_id,
                  media_body=media,
                  supportsAllDrives=True,
              ).execute()
              print("Updated latest-backup.tar.gz")
          else:
              drive.files().create(
                  body={
                      "name": "latest-backup.tar.gz",
                      "parents": [folder_id],
                  },
                  media_body=media,
                  fields="id",
                  supportsAllDrives=True,
              ).execute()
              print("Created latest-backup.tar.gz")
          PY
